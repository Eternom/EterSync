# EterSync messages, MiniMessage format: https://docs.advntr.dev/minimessage/format
# Palette tags (EterLib/config.yml > language.colors): <primary> <accent> <info> <error> <success>
#   <info> = normal light gray text, <accent> = important words in orange.
# Values between <> such as <player> are filled in by the plugin. To show a literal "<", write \< inside 'single quotes'.
# A missing key falls back to the plugin's built-in text: you only need to keep the lines you change.
# The message prefix ("Core") is shared by all plugins: EterLib/config.yml > language.prefix.
# Shared texts ("Cancel", "Unknown player", "players only"...): in EterLib/lang/, for every plugin.

sync:
  busy: "<error>Your data is still being saved on your previous server.\n<info>Please reconnect in a few seconds."
  error: "<error>Your data could not be loaded.\n<info>Please reconnect; if it keeps happening, contact a staff member."
  error-generic: "<error>Something went wrong, please try again later."

history:
  usage: '<error>Usage: <accent>/etersync history \<player>'
  unknown-player: "<error>Unknown player: <accent><player></accent>."
  empty: "<info><accent><player></accent> has no saved data in group <accent><group></accent> yet."
  gone: "<error>This save no longer exists (older saves are removed automatically)."
  title: "<primary>Saves of <player>"
  entry:
    name: "<accent><date>"
    latest: "<accent><date></accent> <success>(current)"
    server: "<dark_gray>▸ <info>Server: <accent><server>"
    reason: "<dark_gray>▸ <info>Saved on: <accent><reason>"
    preview: "<accent>Click <dark_gray>· <info>preview (read only)"
  reason:
    first: "first join"
    quit: "disconnect / server change"
    autosave: "automatic save"
    shutdown: "server shutdown"
    ender_merge: "a server's ender chest merge"
    before_restore: "just before a restore (replaced state)"
    restore: "a staff restore"

preview:
  title: "<primary><player></primary> <dark_gray>· <date>"
  back: "<accent>« Back"
  ender: "<accent>Ender chest"
  inventory: "<accent>Inventory"
  info:
    title: "<accent>Player state"
    health: "<dark_gray>▸ <info>Health: <accent><value>"
    food: "<dark_gray>▸ <info>Food: <accent><value>"
    level: "<dark_gray>▸ <info>Level: <accent><value>"
    gamemode: "<dark_gray>▸ <info>Game mode: <accent><value>"
    effects: "<dark_gray>▸ <info>Effects: <accent><value>"
    items: "<dark_gray>▸ <info>Item stacks: <accent><value>"
  restore:
    name: "<accent>Restore this save"
    lore: "<info>Replaces the player's current inventory,"
    lore2: "<info>ender chest and state."
    click: "<accent>Click <dark_gray>· <info>restore (confirmation)"

restore:
  confirm:
    title: "<primary>Restore <player>?"
    body: "<info>The inventory, ender chest and state of <accent><player></accent> will be replaced by the save from <accent><date></accent>.\n\n<info>First check they did not give away or sell these items (duplication). The current state stays in the history: the restore can be undone."
    button: "Restore"
  done-online: "<success>Save from <accent><date></accent> restored for <accent><player></accent> <info>(applied right away; their previous state is in the history)."
  done-offline: "<success>Save from <accent><date></accent> restored for <accent><player></accent> <info>(they will get it on their next login)."
  elsewhere: "<error><accent><player></accent> is connected to <accent><server></accent>: restore from that server, or wait until they log out."
  busy: "<error><accent><player></accent>'s data is being loaded or saved: try again in a few seconds."
  no-permission: "<error>You don't have permission to restore a save."
  notify: "<info>Your inventory was <accent>restored</accent> by the staff."
